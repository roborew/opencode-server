services:
  opencode:
    build:
      context: .
      args:
        CONFIG_REPO: ${CONFIG_REPO:-https://github.com/roborew/opencode-config-v2.git}
        CONFIG_REF: ${CONFIG_REF:-main}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.3.0}
        NODE_VERSION: ${NODE_VERSION:-24.22.2}
        OPENCODE_UID: ${OPENCODE_UID:-1000}
        OPENCODE_GID: ${OPENCODE_GID:-1000}
        # Pinned docker CLI + compose/buildx plugins (oc-sandbox builds use
        # BuildKit; the mountpoint preflight renders Compose client-side; see
        # docs/sandbox.md).
        DOCKER_CLI_VERSION: ${DOCKER_CLI_VERSION:-29.10.0}
        DOCKER_COMPOSE_VERSION: ${DOCKER_COMPOSE_VERSION:-5.8.0}
        DOCKER_BUILDX_VERSION: ${DOCKER_BUILDX_VERSION:-0.39.1}
    container_name: opencode-server
    restart: unless-stopped
    # Keep a runaway upstream from exhausting the host. `memswap_limit` equals
    # `mem_limit` to disable container swap; both are configurable at runtime.
    mem_limit: ${OPENCODE_MEMORY_LIMIT:-8g}
    memswap_limit: ${OPENCODE_MEMORY_SWAP_LIMIT:-8g}
    healthcheck:
      # The guard returns 401 only after it has reached the upstream; 200 is
      # also accepted for deployments that inject auth into local probes.
      test: ["CMD-SHELL", "status=$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4097/api/info || true); test \"$$status\" = 401 -o \"$$status\" = 200"]
      interval: 30s
      timeout: 10s
      # Cold starts (entrypoint ownership pass + Infisical fetch + serve) can take
      # a couple of minutes on slow disks. Docker may probe during this grace
      # period, but failed probes do not count toward retries until the first
      # successful probe.
      start_period: 180s
      retries: 3
    # Entrypoint starts as root, chowns volumes, then drops to OPENCODE_UID:GID
    # (host user). setup/preflight auto-fills these from `id -u`/`id -g` (or
    # OPENCODE_USERNAME). Do not set compose `user:` — that blocks the drop.
    env_file:
      - .env
    environment:
      OPENCODE_UID: ${OPENCODE_UID:-1000}
      OPENCODE_GID: ${OPENCODE_GID:-1000}
      OPENCODE_CONFIG_DIR: /home/opencode/.config/opencode
      OPENCODE_OVERRIDE: /home/opencode/overrides/opencode.server.json
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      # v2 hardcodes the basic-auth username to "opencode" — there is no
      # OPENCODE_SERVER_USERNAME; a custom username makes every client 401.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      GH_ORG: ${GH_ORG:-}
      GH_PROJECT: ${GH_PROJECT:-}
      GH_TOKEN: ${GH_TOKEN:-}
      # Bearer for the MCPJungle gateway (global config mcp.servers.mcpjungle).
      # MCPJUNGLE_TOKEN is canonical; MCPJUNGLE_OPENCODE_TOKEN kept as fallback.
      MCPJUNGLE_TOKEN: ${MCPJUNGLE_TOKEN:-${MCPJUNGLE_OPENCODE_TOKEN:-}}
      # Bearer for the code-index MCP (overrides/opencode.server.json). compose.sh
      # generates it into .env when neither Infisical nor .env sets one.
      CODE_INDEX_TOKEN: ${CODE_INDEX_TOKEN:?CODE_INDEX_TOKEN is unset - start the stack with ./scripts/compose.sh}
      # oc-sandbox plugin (opencode-config-v2): backend + sidecar wiring.
      # URL/TOKEN stay empty until the §10 sidecar lands (ticket 09); with the
      # sandbox overlay the plugin uses the docker backend through the socket.
      OC_SANDBOX_BACKEND: ${OC_SANDBOX_BACKEND:-}
      OC_SANDBOX_URL: ${OC_SANDBOX_URL:-}
      OC_SANDBOX_TOKEN: ${OC_SANDBOX_TOKEN:-}
      DOCKER_HOST_INTERNAL: ${DOCKER_HOST_INTERNAL:-host.docker.internal}
      LOCALHOST_REWRITE: ${LOCALHOST_REWRITE:-1}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_USE_CLI: ${INFISICAL_USE_CLI:-true}
      OPENCODE_APPS_DIR: ${OPENCODE_APPS_DIR:-${HOME}/projects}
      OPENCODE_WORKTREES_DIR: ${OPENCODE_WORKTREES_DIR:-${HOME}/.local/share/opencode/worktree}
      # Git identity for agent commits inside the container
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-}
      # Persistent OpenCode runtime state (volume via /var/opencode-xdg).
      XDG_DATA_HOME: /var/opencode-xdg
      OPENCODE_CONTAINER_XDG: /var/opencode-xdg
      # Sysbox sibling sandboxes (optional). Default off — Mac-identical.
      # When enabled, setup sets OPENCODE_SANDBOX_ENABLED=1 and merges
      # docker-compose.sandbox.yml (host docker.sock). See docs/sandbox.md.
      OPENCODE_SANDBOX_MODE: ${OPENCODE_SANDBOX_MODE:-off}
      OPENCODE_SANDBOX_ENABLED: ${OPENCODE_SANDBOX_ENABLED:-0}
      OPENCODE_SANDBOX_IMAGE: ${OPENCODE_SANDBOX_IMAGE:-opencode-sandbox:local}
      OPENCODE_SANDBOX_RUNTIME: ${OPENCODE_SANDBOX_RUNTIME:-sysbox-runc}
      OPENCODE_SANDBOX_STATE_DIR: /var/opencode-xdg/sandboxes
      OPENCODE_SANDBOX_REVIEW_DNS: ${OPENCODE_SANDBOX_REVIEW_DNS:-on}
      OPENCODE_SANDBOX_ROUTE_IMAGE: ${OPENCODE_SANDBOX_ROUTE_IMAGE:-alpine/socat:1.8.0.0}
      OPENCODE_SANDBOX_TUNNEL_ID: ${OPENCODE_SANDBOX_TUNNEL_ID:-}
    volumes:
      # Server state (DB/sessions/MCP auth) — named volume only; wipe with
      # ./scripts/wipe-opencode-data.sh or `docker compose down -v`.
      # Repos: host same-path bind (code only).
      # Worktrees: host dir for Tower/local Git + container create path.
      - opencode-data:/var/lib/opencode-data
      - ${OPENCODE_WORKTREES_DIR:-${HOME}/.local/share/opencode/worktree}:/var/opencode-xdg/opencode/worktree:delegated
      - ${OPENCODE_WORKTREES_DIR:-${HOME}/.local/share/opencode/worktree}:${OPENCODE_WORKTREES_DIR:-${HOME}/.local/share/opencode/worktree}:delegated
      - ${OPENCODE_APPS_DIR:-${HOME}/projects}:${OPENCODE_APPS_DIR:-${HOME}/projects}:delegated
    working_dir: ${OPENCODE_APPS_DIR:-${HOME}/projects}
    ports:
      # Host + container port 4097 — avoids Kilo/other tools on 4096
      - "${OPENCODE_PUBLISH_PORT:-4097}:4097"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      opencode-net:
        aliases:
          # FQDN for Twingate resource (override via OPENCODE_FQDN)
          - ${OPENCODE_FQDN:-opencode.local}
      code-index-net: {}
    depends_on:
      # Not a hard gate: OpenCode works without the index (the MCP just shows
      # as failed), so only wait for the container to be created.
      code-index:
        condition: service_started
        required: false

  # Local code index: codebase-memory-mcp behind mcp-proxy, reached by OpenCode
  # as the `code-index` remote MCP (opencode-config-v2 ADR 0017). Code is
  # mounted read-only at the same paths OpenCode uses; the index lives in the
  # code-index-cache volume. No published port and no internet access.
  code-index:
    build:
      context: ./docker/code-index
      args:
        CBM_VERSION: ${CBM_VERSION:-0.12.1}
        CODE_INDEX_UID: ${OPENCODE_UID:-1000}
        CODE_INDEX_GID: ${OPENCODE_GID:-1000}
    container_name: code-index
    restart: unless-stopped
    mem_limit: ${CODE_INDEX_MEMORY_LIMIT:-2g}
    memswap_limit: ${CODE_INDEX_MEMORY_LIMIT:-2g}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CODE_INDEX_TOKEN: ${CODE_INDEX_TOKEN:?CODE_INDEX_TOKEN is unset - start the stack with ./scripts/compose.sh}
      CODE_INDEX_REFRESH_SECONDS: ${CODE_INDEX_REFRESH_SECONDS:-30}
    volumes:
      - code-index-cache:/var/lib/code-index
      - ${OPENCODE_APPS_DIR:-${HOME}/projects}:${OPENCODE_APPS_DIR:-${HOME}/projects}:ro
      - ${OPENCODE_WORKTREES_DIR:-${HOME}/.local/share/opencode/worktree}:${OPENCODE_WORKTREES_DIR:-${HOME}/.local/share/opencode/worktree}:ro
    networks:
      - code-index-net

  twingate-connector:
    image: twingate/connector:1
    container_name: twingate-connector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TWINGATE_NETWORK: ${TWINGATE_NETWORK:-}
      TWINGATE_ACCESS_TOKEN: ${TWINGATE_ACCESS_TOKEN:-}
      TWINGATE_REFRESH_TOKEN: ${TWINGATE_REFRESH_TOKEN:-}
      TWINGATE_LABEL_HOSTNAME: opencode-connector
      TWINGATE_LOG_ANALYTICS: v2
      TWINGATE_LOG_LEVEL: "3"
    # Do NOT set TWINGATE_DNS to 1.1.1.1/8.8.8.8 — that bypasses Docker
    # embedded DNS and breaks resolving OPENCODE_FQDN / service names.
    # Prefer ./scripts/compose.sh so TWINGATE_* come from Infisical at start.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    networks:
      - opencode-net

volumes:
  opencode-data:
  code-index-cache:

networks:
  opencode-net:
    driver: bridge
  # Internal: opencode <-> code-index only, no route to the internet.
  code-index-net:
    driver: bridge
    internal: true
